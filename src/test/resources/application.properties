# ── Configurações de teste: H2 em memória (substitui PostgreSQL em produção) ──

# H2 em memória — banco recriado a cada execução dos testes
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA cria as tabelas automaticamente no H2 (create-drop garante isolamento total)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Thymeleaf
spring.thymeleaf.cache=false

# Gemini: sem chave nos testes → fallback LlmSimulado ativado automaticamente
gemini.api.key=
gemini.model=gemini-3.5-flash-lite
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.timeout-seconds=4
