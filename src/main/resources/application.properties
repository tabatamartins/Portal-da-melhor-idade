spring.application.name=portal-melhor-idade
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Banco principal: PostgreSQL. O perfil padrão (dev) substitui esta configuração por H2.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portal_melhor_idade}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.timeout-seconds=4

spring.profiles.default=dev
