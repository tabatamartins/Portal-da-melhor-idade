# Perfil de produção: exige credenciais fornecidas pelo ambiente de hospedagem.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pmi}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# O Flyway controla a estrutura; o Hibernate apenas valida o esquema.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Configurações adequadas para execução em servidor.
spring.thymeleaf.cache=true
server.port=${PORT:8080}
server.forward-headers-strategy=framework
