databases:
  - name: pmi-db
    databaseName: pmi
    user: pmi_user
    plan: free

services:
  - type: web
    name: portal-melhor-idade
    runtime: docker
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: pmi-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pmi-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: pmi-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: pmi-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: pmi-db
          property: password
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
